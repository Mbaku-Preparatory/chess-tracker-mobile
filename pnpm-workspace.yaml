onlyBuiltDependencies:
  - '@sentry/cli'
  - '@shopify/react-native-skia'

# The board library, patched (two small changes, both marked "[chess-preparatory
# patch]"): the legal square under a dragged piece is lit, and a capture shows
# a ring instead of a dot, as on the website (components/analysis/Board.tsx
# there). Updating react-native-chessboard means re-making this patch:
# `pnpm patch react-native-chessboard@<new>`, reapply, `pnpm patch-commit`.
patchedDependencies:
  react-native-chessboard@0.2.0: patches/react-native-chessboard@0.2.0.patch

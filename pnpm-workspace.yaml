# pnpm settings live here from 10.16 onward — the `pnpm` field in package.json
# is no longer read, which is what broke EAS build 74a7a562: locally that field
# was merely ignored with a warning, but the newer pnpm on EAS treats an
# unapproved build script as ERR_PNPM_IGNORED_BUILDS and fails the install.
#
# @sentry/cli arrives via @sentry/react-native. Its postinstall fetches a
# binary, which the platform package @sentry/cli-linux-x64 already provides —
# so this approval is about letting the install finish, not about needing the
# script to do anything.
onlyBuiltDependencies:
  - '@sentry/cli'
